<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <title>{% block title %}Green Mile HR{% endblock %}</title>
  <script>
    try{if(sessionStorage.getItem('gmNav'))document.documentElement.classList.add('gm-loading');}catch(e){}
  </script>
  {% if agency_favicon_url %}
  <link rel="icon" href="{{ agency_favicon_url }}" sizes="any" id="gmFavicon">
  <link rel="apple-touch-icon" href="{{ agency_favicon_url }}" id="gmAppleIcon">
  {% else %}
  <link rel="icon" href="{{ url_for('static', filename='green-mile-favicon.svg') }}" type="image/svg+xml" id="gmFavicon">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='green-mile-logo.png') }}" id="gmAppleIcon">
  {% endif %}
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <div id="appLoader" class="app-loader" hidden aria-live="polite" aria-busy="false">
    <div class="app-loader-panel">
      <div class="app-loader-orbit" aria-hidden="true"><span></span><span></span><span></span></div>
      <p class="app-loader-text">Loading workspace</p>
      <div class="app-loader-bar" aria-hidden="true"><i></i></div>
    </div>
  </div>
  {% block body %}{% endblock %}
  {% block scripts %}
  <script src="{{ url_for('static', filename='js/app-shell.js') }}"></script>
  <script src="{{ url_for('static', filename='js/form-validate.js') }}"></script>
  <script src="{{ url_for('static', filename='js/logo-editor.js') }}"></script>
  <script src="{{ url_for('static', filename='js/doc-viewer.js') }}"></script>
  <script>
    function toggleSidebar(){document.getElementById('sidebar')?.classList.toggle('open');}
    function toggleHeaderMenu(btn){
      const menu=btn&&btn.closest('.header-menu');
      if(!menu) return;
      const open=menu.classList.contains('open');
      document.querySelectorAll('.header-menu.open').forEach(m=>m.classList.remove('open'));
      if(!open) menu.classList.add('open');
    }
    if(!window.__gmHeaderMenuBound){
      window.__gmHeaderMenuBound=true;
      document.addEventListener('click',function(e){
        if(e.target.closest('.header-menu')) return;
        if(window.__gmNotifyHoldUntil && Date.now()<window.__gmNotifyHoldUntil) return;
        document.querySelectorAll('.header-menu.open').forEach(m=>m.classList.remove('open'));
      });
    }
  </script>
  {% endblock %}
</body>
</html>
